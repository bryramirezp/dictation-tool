name: Release

# Push a tag and this builds the installer, the portable zip and the hashes,
# then publishes them:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Run it by hand to check a build without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = Get-Content kara.py -Raw
          $ver = [regex]::Match($src, '(?m)^__version__ = "(.+)"').Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) {
            throw "tag $tag does not match __version__ $ver"
          }
          Write-Host "version $ver"

      - name: Build
        run: python packaging/build.py

      - name: Keep the build even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: Kara
          path: |
            dist/Kara-Setup-*.exe
            dist/Kara-*-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @(
            (Get-Item dist/Kara-Setup-*.exe).FullName
            (Resolve-Path dist/Kara-Setup.exe).Path
            (Get-Item dist/Kara-*-portable.zip).FullName
            (Resolve-Path dist/SHA256SUMS.txt).Path
          )
          # The release may already exist: creating the tag through the web or
          # the gh CLI publishes one and then triggers this workflow.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Kara $tag" --generate-notes
          }
