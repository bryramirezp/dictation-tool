name: Release

# Push a tag and this builds the installer, the portable zip and the hashes,
# then publishes them:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Run it by hand to check a build without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # requirements-gpu.txt includes requirements.txt and adds the CUDA
      # wheels. Installing them before both builds is safe: the processor build
      # excludes the nvidia package by name in kara.spec, so what is installed
      # in the environment does not decide what ends up in the file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-gpu.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = Get-Content kara.py -Raw
          $ver = [regex]::Match($src, '(?m)^__version__ = "(.+)"').Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) {
            throw "tag $tag does not match __version__ $ver"
          }
          Write-Host "version $ver"

      # Before the build, so no installer exists yet and stamp_docs leaves the
      # size alone. What it does check is everything derived from __version__,
      # which is the part that actually rotted: the JSON-LD sat three releases
      # behind because nothing connected it to the source.
      - name: Check the docs quote this version
        run: python tools/stamp_docs.py --check

      # Ordinary build first, and on its own: it is the one whose size the
      # website quotes, and stamp_docs -- which build.py runs at the end -- must
      # not see the 1.2 GB file when it works that number out.
      - name: Build the processor installer
        run: python packaging/build.py

      - name: Build the GPU installer
        run: python packaging/build.py --gpu

      # Only now, with both files present, so the page can quote both sizes.
      - name: Stamp both sizes into the docs
        run: python tools/stamp_docs.py

      # The size is a different matter. It is only knowable after a build, and
      # this build is not the maintainer's -- a different dependency resolution
      # here weighs a few MB more or less, so an exact match is not something to
      # hold a release hostage to. Reported, not enforced.
      - name: Report any drift in the size the docs quote
        if: always()
        shell: pwsh
        run: |
          $dirty = git status --porcelain -- README.md docs
          if ($dirty) {
            Write-Host "::warning::the docs quote a different installer size than this build produced"
            git --no-pager diff -- README.md docs
          } else {
            Write-Host "docs match this build exactly"
          }

      - name: Keep the build even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: Kara
          path: |
            dist/Kara-Setup-*.exe
            dist/Kara-*-portable.zip
            dist/SHA256SUMS*.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Four executables now: the two versioned installers and the two
          # fixed-name aliases the website's buttons point at. One wildcard
          # catches all of them -- listing the aliases separately would upload
          # Kara-Setup-GPU.exe twice, since it matches Kara-Setup-*.exe as well.
          # Sorted unique for the same reason, cheaply.
          $files = @(
            (Get-Item dist/Kara-Setup*.exe).FullName
            (Get-Item dist/Kara-*-portable.zip).FullName
            (Get-Item dist/SHA256SUMS*.txt).FullName
          ) | Sort-Object -Unique
          # Notes come from CHANGELOG.md rather than --generate-notes, which
          # lists merged pull requests and, this project having none, produced a
          # release body containing nothing but a link to the diff. This exits
          # non-zero if the tag has no section, so a release cannot go out
          # saying nothing about itself.
          python tools/release_notes.py $tag --out notes.md
          if ($LASTEXITCODE -ne 0) { throw "no CHANGELOG section for $tag" }

          # The release may already exist: creating the tag through the web or
          # the gh CLI publishes one and then triggers this workflow.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --notes-file notes.md
          } else {
            gh release create $tag @files --title "Kara $tag" --notes-file notes.md
          }
