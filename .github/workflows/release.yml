name: Release

# Push a tag and this builds the installer, the portable zip and the hashes,
# then publishes them:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# Run it by hand to check a build without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $src = Get-Content dictation_tool.py -Raw
          $ver = [regex]::Match($src, '(?m)^__version__ = "(.+)"').Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -ne $tag) {
            throw "tag $tag does not match __version__ $ver"
          }
          Write-Host "version $ver"

      - name: Build
        run: python packaging/build.py

      - name: Keep the build even when nothing is published
        uses: actions/upload-artifact@v4
        with:
          name: DictationTool
          path: |
            dist/DictationTool-Setup-*.exe
            dist/DictationTool-*-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            (Get-Item dist/DictationTool-Setup-*.exe).FullName `
            (Get-Item dist/DictationTool-*-portable.zip).FullName `
            dist/SHA256SUMS.txt `
            --title "Dictation Tool ${{ github.ref_name }}" `
            --generate-notes
